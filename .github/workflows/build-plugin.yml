name: SDK 编译插件

on:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: "插件源码仓库地址"
        required: true
        type: string
        default: ""

      architecture:
        description: "选择目标架构"
        required: true
        type: choice
        options:
          - LEDE_Cudy
          - LEDE_R3S
          - LEDE_x86

      plugin_name:
        description: "插件包（空格或逗号连接）"
        required: true
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. 查找对应架构 SDK
      # ============================================================
      - name: 🔍 查找 SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ inputs.architecture }}
          SDK_REPO: xcz-ns/LEDE
          PLUGIN_INPUT: ${{ inputs.plugin_name }}
        run: |
          set -euo pipefail

          # 规范化插件名称用于 Artifact
          ARTIFACT_NAME=$(printf '%s' "$PLUGIN_INPUT" \
            | tr ', ' '__' \
            | tr -cs 'A-Za-z0-9._-' '-')

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "SDK_REPO=$SDK_REPO" >> "$GITHUB_ENV"

          echo "==== 查找 ${ARCH} SDK ===="

          TAGS=$(gh release list \
            -R "$SDK_REPO" \
            -L 100 \
            --json tagName \
            -q '.[].tagName | select(endswith("'"$ARCH"'"))')

          if [[ -z "$TAGS" ]]; then
            echo "::error::未找到以 ${ARCH} 结尾的 Release"
            exit 1
          fi

          for tag in $TAGS; do
            ASSET=$(gh release view "$tag" \
              -R "$SDK_REPO" \
              --json assets \
              -q '.assets[].name | select(test("^openwrt-sdk.*\\.tar\\.xz$"))' \
              | head -n1 || true)

            if [[ -n "$ASSET" ]]; then
              echo "SDK_TAG=$tag" >> "$GITHUB_ENV"
              echo "SDK_ASSET=$ASSET" >> "$GITHUB_ENV"

              echo "SDK Release : $tag"
              echo "SDK Asset   : $ASSET"

              exit 0
            fi
          done

          echo "::error::${ARCH} 未找到 openwrt-sdk*.tar.xz"
          exit 1


      # ============================================================
      # 2. 下载并解压 SDK
      # ============================================================
      - name: 📥 下载 SDK
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/${SDK_REPO}/releases/download/${SDK_TAG}/${SDK_ASSET}"

          echo "下载：$URL"

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            -sS \
            -o sdk.tar.xz \
            "$URL"

          tar -xJf sdk.tar.xz

          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)

          if [[ -z "$SDK_DIR" ]]; then
            echo "::error::SDK 解压失败"
            exit 1
          fi

          SDK_DIR="${SDK_DIR#./}"

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

          echo "SDK 目录：$SDK_DIR"


      # ============================================================
      # 3. 导入插件源码
      # ============================================================
      - name: 📂 导入插件源码
        shell: bash
        env:
          REPO_URL: ${{ inputs.firmware_repo }}
          PLUGIN_INPUT: ${{ inputs.plugin_name }}
        run: |
          set -euo pipefail

          echo "==== 解析插件仓库 ===="

          REPO_NORM=$(echo "$REPO_URL" \
            | sed -E 's|.*github\.com[:/]?([^/]+/[^/.]+)(\.git)?|\1|')

          if [[ -z "$REPO_NORM" ]]; then
            echo "::error::无法解析 GitHub 仓库地址"
            exit 1
          fi

          echo "仓库：$REPO_NORM"

          git clone \
            --depth 1 \
            --single-branch \
            "https://github.com/${REPO_NORM}.git" \
            /tmp/custom_source

          cd "$SDK_DIR"

          # ----------------------------------------------------------
          # 解析第一个插件名称
          # ----------------------------------------------------------
          FIRST_PLUGIN=$(echo "$PLUGIN_INPUT" \
            | tr ',' ' ' \
            | awk '{print $1}')

          if [[ -z "$FIRST_PLUGIN" ]]; then
            echo "::error::插件名称不能为空"
            exit 1
          fi

          # ----------------------------------------------------------
          # 情况 1：仓库根目录就是插件
          # ----------------------------------------------------------
          if [[ -f /tmp/custom_source/Makefile ]]; then

            echo "=> 检测到单插件仓库"

            mkdir -p package

            mv /tmp/custom_source "package/${FIRST_PLUGIN}"

            echo "插件路径：package/${FIRST_PLUGIN}"

          # ----------------------------------------------------------
          # 情况 2：仓库包含多个插件 / 嵌套目录
          # ----------------------------------------------------------
          else

            echo "=> 检测到多插件 / 嵌套插件仓库"

            mkdir -p package/custom

            cp -a /tmp/custom_source/. package/custom/

            echo "插件源码已导入：package/custom/"

          fi


      # ============================================================
      # 4. 初始化 SDK 配置
      # ============================================================
      - name: ⚙️ 初始化 SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SDK_DIR"

          # 禁止 SDK 自动选择全部软件包
          cat >> .config <<'EOF'

          # SDK custom build
          # CONFIG_ALL is not set
          # CONFIG_ALL_KMODS is not set
          # CONFIG_ALL_NONSHARED is not set
          EOF

          make defconfig

          echo "==== SDK 配置完成 ===="


      # ============================================================
      # 5. 查找并编译目标插件
      # ============================================================
      - name: 🛠️ 编译目标插件
        shell: bash
        env:
          PLUGIN_INPUT: ${{ inputs.plugin_name }}
        run: |
          set -euo pipefail

          cd "$SDK_DIR"

          # 支持：
          # luci-app-a luci-app-b
          # luci-app-a,luci-app-b
          # luci-app-a, luci-app-b
          PLUGIN_INPUT="${PLUGIN_INPUT//,/ }"

          read -r -a PLUGINS <<< "$PLUGIN_INPUT"

          MISSING=()

          for NAME in "${PLUGINS[@]}"; do

            [[ -z "$NAME" ]] && continue

            echo ""
            echo "============================================================"
            echo "检查插件：$NAME"
            echo "============================================================"

            TARGET=""

            # --------------------------------------------------------
            # 优先检查常见位置
            # --------------------------------------------------------

            for DIR in \
              "package/$NAME" \
              "package/custom/$NAME"
            do
              if [[ -f "$DIR/Makefile" ]]; then
                TARGET="$DIR"
                break
              fi
            done

            # --------------------------------------------------------
            # 常见位置没找到，再全局搜索
            # --------------------------------------------------------

            if [[ -z "$TARGET" ]]; then
              TARGET=$(find package \
                -type f \
                -name Makefile \
                -path "*/$NAME/Makefile" \
                -not -path '*/.git/*' \
                -print \
                -quit \
                | sed 's|/Makefile$||')
            fi

            # --------------------------------------------------------
            # 插件不存在
            # --------------------------------------------------------

            if [[ -z "$TARGET" ]]; then
              echo "::error::未找到插件：$NAME"
              MISSING+=("$NAME")
              continue
            fi

            echo "=> 插件路径：$TARGET"

            # --------------------------------------------------------
            # 编译
            # --------------------------------------------------------

            echo "=> 开始并行编译：$NAME"

            if ! make "${TARGET}/compile" -j"$(nproc)"; then

              echo ""
              echo "============================================================"
              echo "并行编译失败，切换单线程详细日志"
              echo "插件：$NAME"
              echo "============================================================"

              make "${TARGET}/compile" -j1 V=s
            fi

          done

          # ----------------------------------------------------------
          # 汇总缺失插件
          # ----------------------------------------------------------

          if (( ${#MISSING[@]} > 0 )); then
            echo ""
            echo "::error::以下插件未找到或缺少 Makefile："
            printf ' - %s\n' "${MISSING[@]}"
            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "所有目标插件编译完成"
          echo "============================================================"


      # ============================================================
      # 6. 上传 IPK
      # ============================================================
      - name: 📤 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ inputs.architecture }}-${{ env.SDK_TAG }}
          path: ${{ env.SDK_DIR }}/bin/**/*.ipk
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 7. 清理历史运行
      # ============================================================
      - name: 🧹 清理历史运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"

          echo "==== 清理失败 / 取消的运行记录 ===="

          gh api "repos/${REPO}/actions/runs" \
            --paginate \
            -q '.workflow_runs[]
                | select(.conclusion=="failure" or .conclusion=="cancelled")
                | .id' |
          xargs -r -I {} \
            gh api -X DELETE "repos/${REPO}/actions/runs/{}"

          echo "==== 清理 3 天以前的成功记录 ===="

          CUTOFF=$(date -d "3 days ago" -u +"%Y-%m-%dT%H:%M:%SZ")

          gh api "repos/${REPO}/actions/runs" \
            --paginate \
            -q '.workflow_runs[]
                | select(.conclusion=="success" and .created_at < "'"$CUTOFF"'")
                | .id' |
          xargs -r -I {} \
            gh api -X DELETE "repos/${REPO}/actions/runs/{}"

          echo "==== 清理完成 ===="