name: SDK 编译插件

on:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: "插件源码仓库地址（支持 https://github.com/a/b、git@github.com:a/b.git、a/b 三种写法）"
        required: true
        type: string
      architecture:
        description: "选择目标架构"
        required: true
        type: choice
        options:
          - LEDE_Cudy
          - LEDE_R3S
          - LEDE_x86
      plugin_name:
        description: "插件包（空格或逗号连接）"
        required: true
        type: string

# 最小权限：contents 只读 + actions 写（清理历史 runs 所需）
permissions:
  contents: read
  actions: write

env:
  SDK_REPO: xcz-ns/LEDE     # SDK release 所在仓库
  TREE_MAX_DEPTH: 3         # 文件树最大深度，防止输出过长
  TREE_FILE_LIMIT: 50       # 单个目录最多展示的条目数

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCH: ${{ github.event.inputs.architecture }}
    steps:
      # ==================== 步骤 0：环境信息 ====================
      - name: ℹ️ 打印运行环境信息
        shell: bash
        run: |
          echo "🧩 构建环境"
          echo "  目标架构 : ${ARCH}"
          echo "  插件包   : ${{ github.event.inputs.plugin_name }}"
          echo "  源码仓库 : ${{ github.event.inputs.firmware_repo }}"
          echo "  平台     : $(uname -m) / $(nproc) 核 / 磁盘可用 $(df -h / | awk 'NR==2{print $4}')"
          free -h | awk '/Mem:/{print "  内存     : 总 "$2" / 可用 "$7}'

      # ==================== 步骤 1：解析 SDK ====================
      - name: 🔍 解析 SDK 构建资产
        shell: bash
        run: |
          set -euo pipefail

          # 插件名 -> 合法产物名（防止空串或全符号导致产物名异常）
          ARTIFACT_NAME=$(printf '%s' "${{ github.event.inputs.plugin_name }}" | tr -c 'A-Za-z0-9._-' '-')
          [[ -z "$ARTIFACT_NAME" || "$ARTIFACT_NAME" =~ ^-+$ ]] && ARTIFACT_NAME="plugin"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "::notice::插件列表: ${{ github.event.inputs.plugin_name }}"

          # 拉取该架构全部 release 标签，逐个查找 openwrt-sdk 资产
          TAGS=$(gh release list -R "${SDK_REPO}" -L 100 --json tagName \
            -q '.[].tagName | select(endswith("'"${ARCH}"'"))')
          if [[ -z "$TAGS" ]]; then
            echo "::error::未找到以 ${ARCH} 结尾的 release 标签"
            exit 1
          fi

          SDK_TAG=""
          SDK_ASSET=""
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            ASSET=$(gh release view "$tag" -R "${SDK_REPO}" --json assets \
              -q '.assets[].name | select(test("^openwrt-sdk.*\\.tar\\.xz$"))' | head -n1 || true)
            if [[ -n "$ASSET" ]]; then
              SDK_TAG="$tag"
              SDK_ASSET="$ASSET"
              break
            fi
            echo "::warning::release ${tag} 未包含 openwrt-sdk 资产，跳过"
          done <<< "$TAGS"

          if [[ -z "$SDK_TAG" ]]; then
            echo "::error::架构 ${ARCH} 下未找到 openwrt-sdk 资产"
            exit 1
          fi

          echo "SDK_TAG=${SDK_TAG}" >> "$GITHUB_ENV"
          echo "SDK_ASSET=${SDK_ASSET}" >> "$GITHUB_ENV"
          echo "✅ 锁定 SDK: ${SDK_TAG} / ${SDK_ASSET}"

          # 写入运行页 Step Summary
          {
            echo "### 🔍 SDK 资产解析"
            echo "- 目标架构: ${ARCH}"
            echo "- Release 标签: ${SDK_TAG}"
            echo "- SDK 资产: ${SDK_ASSET}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==================== 步骤 2：下载解压 ====================
      - name: 📥 下载解压 SDK
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${SDK_REPO}/releases/download/${SDK_TAG}/${SDK_ASSET}"
          echo "📦 下载: ${url}"
          curl -fL --retry 3 --retry-delay 5 -sS -o sdk.tar.xz "${url}"
          ls -lh sdk.tar.xz

          tar -xJf sdk.tar.xz
          SDK_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -n1 || true)
          if [[ -z "$SDK_DIR" || ! -d "$SDK_DIR" ]]; then
            echo "::error::SDK 解压后未找到 openwrt-sdk-* 目录"
            exit 1
          fi
          # 基本完整性校验
          [[ -f "${SDK_DIR}/feeds.conf.default" ]] || echo "::warning::SDK 缺少 feeds.conf.default，feeds 可能异常"
          echo "SDK_DIR=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "✅ 解压完成: ${SDK_DIR}（$(du -sh "${SDK_DIR}" | cut -f1)）"

      # ==================== 步骤 2.5：输出 SDK 文件树 ====================
      - name: 🌳 输出 SDK 文件树（超限目录折叠/截断）
        shell: bash
        run: |
          # 注意：Actions 对 bash 默认带 errexit(-e)；本步骤是信息展示，必须显式关闭
          set -u -o pipefail
          set +e
          SDK_DIR="${{ env.SDK_DIR }}"
          OUT=/tmp/sdk_tree.txt

          echo "SDK_DIR=${SDK_DIR}"
          echo "tree: $(command -v tree || echo '未安装，尝试安装')"

          # 没有 tree 就尝试安装
          if ! command -v tree >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq tree >/dev/null 2>&1
          fi

          # tree 存在则输出文件树；--filelimit=N：目录条目超过 N 时折叠为 [N]
          # 注意：tree 2.0+ 即使正常输出也可能返回非零退出码（符号链接等边缘情况），
          # 因此不以退出码判断成败，只看输出文件是否有内容
          if command -v tree >/dev/null 2>&1; then
            tree -L "${TREE_MAX_DEPTH}" --filelimit "${TREE_FILE_LIMIT}" "${SDK_DIR}" > "${OUT}" 2>/tmp/tree_err.txt || true
            if [[ ! -s "${OUT}" ]]; then
              echo "::warning::tree 未生成输出，错误："
              cat /tmp/tree_err.txt
            fi
          fi

          # tree 不可用或失败时，用 find 兜底，保证文件树不空白
          if [[ ! -s "${OUT}" ]]; then
            echo "::notice::tree 不可用，使用 find 兜底输出"
            find "${SDK_DIR}" -maxdepth "${TREE_MAX_DEPTH}" -print > "${OUT}" 2>/dev/null
          fi

          # 同时输出到构建日志和运行页 Step Summary
          echo "===== SDK 文件树 ====="
          cat "${OUT}" || true
          {
            echo "### 🌳 SDK 文件树"
            echo '```text'
            cat "${OUT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

          # 信息展示步骤永远不阻断构建
          exit 0

      # ==================== 步骤 3：引入插件源码 ====================
      - name: 📂 引入第三方插件源码
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REPO="${{ github.event.inputs.firmware_repo }}"

          # 归一化：https://github.com/a/b(.git) / git@github.com:a/b.git / a/b
          REPO_NORM=$(printf '%s' "${INPUT_REPO}" \
            | sed -E 's#^(https?|ssh)://github\.com/##; s#^git@github\.com:##; s#\.git$##; s#/+$##')
          if [[ ! "${REPO_NORM}" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "::error::无法解析仓库地址: ${INPUT_REPO}（支持 https://github.com/a/b、git@github.com:a/b.git、a/b）"
            exit 1
          fi

          echo "🧬 插件源: https://github.com/${REPO_NORM}"
          git clone --depth 1 --single-branch "https://github.com/${REPO_NORM}.git" /tmp/custom_source

          cd "${SDK_DIR}"

          if [[ -f /tmp/custom_source/Makefile ]]; then
            # 单插件仓库：以第一个插件名作为目录名
            FIRST_PLUGIN=$(printf '%s' "${{ github.event.inputs.plugin_name }}" | awk -F'[, ]+' '{print $1}')
            if [[ -z "${FIRST_PLUGIN}" ]]; then
              echo "::error::plugin_name 为空，无法确定插件目录名"
              exit 1
            fi
            # 防止与 SDK 内置目录同名导致 mv 嵌套
            if [[ -e "package/${FIRST_PLUGIN}" ]]; then
              echo "::warning::package/${FIRST_PLUGIN} 已存在，将被覆盖"
              rm -rf "package/${FIRST_PLUGIN}"
            fi
            mv /tmp/custom_source "package/${FIRST_PLUGIN}"
            echo "=> 单插件仓库：移至 package/${FIRST_PLUGIN}"
          else
            # 多插件/嵌套仓库：整体移入 package/custom/（含隐藏文件，排除 .git）
            mkdir -p package/custom
            find /tmp/custom_source -mindepth 1 -maxdepth 1 -not -name '.git' -exec mv {} package/custom/ \;
            echo "=> 多插件仓库：已移入 package/custom/"
          fi

          echo "✅ 插件源码就绪，package/ 下目录："
          ls -1 package/

      # ==================== 步骤 4：feeds ====================
      - name: 🔄 更新与安装 feeds
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "✅ feeds 更新安装完成"

      # ==================== 步骤 5：构建配置 ====================
      - name: ⚙️ 生成构建配置（仅编译目标插件）
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          # 关闭"默认全量编译"，只编译显式指定的插件，大幅缩短构建时间
          printf '%s\n' \
            '# CONFIG_ALL is not set' \
            '# CONFIG_ALL_KMODS is not set' \
            '# CONFIG_ALL_NONSHARED is not set' > .config
          make defconfig
          echo "✅ 配置生成完毕"
          grep -E '^CONFIG_TARGET_(BOARD|ARCH|SUBTARGET)' .config | head -5 || true

      # ==================== 步骤 6：编译 ====================
      - name: 🛠️ 编译目标插件
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          PLUGIN_INPUT="${{ github.event.inputs.plugin_name }}"
          read -r -a PLUGINS <<< "${PLUGIN_INPUT//,/ }"

          MISSING=""
          BUILT_OK=()

          for name in "${PLUGINS[@]}"; do
            [[ -z "${name}" ]] && continue
            echo "===== 编译: ${name} ====="

            # 在 package/ 下全局查找同名目录并确认含 Makefile
            TARGET=$(find package -type d -name "${name}" -not -path '*/.git*' | while read -r dir; do
              if [[ -f "${dir}/Makefile" ]]; then
                echo "${dir}"
                break
              fi
            done | head -n1)

            if [[ -z "${TARGET}" ]]; then
              echo "::warning::未找到插件目录或缺少 Makefile: ${name}"
              MISSING="${MISSING} ${name}"
              continue
            fi

            echo "=> 锁定路径: ${TARGET}"
            echo "::group::🔨 ${name} 编译日志"
            # 关键：命令行传 CONFIG_PACKAGE_<name>=y 强制选中该包，
            # 否则 OpenWrt 因 .config 未选中而跳过打包（编译"成功"但不产出 ipk）
            if make "${TARGET}/compile" -j"$(nproc)" "CONFIG_PACKAGE_${name}=y"; then
              echo "::notice::${name} 编译成功"
              BUILT_OK+=("${name}")
            else
              # 失败时单线程重跑以获得完整错误日志
              echo "::warning::${name} 多线程编译失败，单线程重试（V=s）"
              make "${TARGET}/compile" -j1 V=s "CONFIG_PACKAGE_${name}=y"
            fi
            echo "::endgroup::"
          done

          {
            echo "### 🛠️ 编译结果"
            echo "- ✅ 成功: ${BUILT_OK[*]:-（无）}"
            echo "- ⚠️ 缺失/失败: ${MISSING:-（无）}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${MISSING}" ]]; then
            echo "::error::以下插件未找到或缺少 Makefile: ${MISSING}"
            exit 1
          fi

      # ==================== 步骤 7：统计产物 ====================
      - name: 📤 统计编译产物
        shell: bash
        run: |
          # 信息展示步骤：关闭 errexit，不统计失败就阻断构建
          set -u -o pipefail
          set +e
          cd "${SDK_DIR}"
          IPK_LIST=$(find bin -name '*.ipk' 2>/dev/null | sort)
          IPK_COUNT=$(printf '%s' "${IPK_LIST}" | grep -c .)
          echo "IPK_COUNT=${IPK_COUNT}" >> "$GITHUB_ENV"

          {
            echo "### 📤 产物清单（共 ${IPK_COUNT} 个 ipk）"
            echo '```text'
            if [[ -n "${IPK_LIST}" ]]; then
              echo "${IPK_LIST}" | while read -r f; do printf '%s  (%s)\n' "${f}" "$(du -h "${f}" | cut -f1)"; done
            else
              echo "（未找到任何 .ipk 产物）"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

          exit 0

      # ==================== 步骤 8：上传产物 ====================
      - name: ⬆️ 上传 ipk 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ env.ARCH }}-${{ env.SDK_TAG }}
          path: ${{ env.SDK_DIR }}/bin/**/*.ipk
          if-no-files-found: error
          retention-days: 7

      # ==================== 步骤 9：清理历史 runs ====================
      - name: 🧹 清理历史运行记录
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPO=${{ github.repository }}
          echo "==== 开始清理 ${REPO} 的历史 runs ===="

          delete_runs() {  # $1: jq 过滤条件, $2: 说明
            local filter="$1" desc="$2" ids
            ids=$(gh api "repos/${REPO}/actions/runs?per_page=100" --paginate \
              -q ".workflow_runs[] | select(${filter}) | .id" 2>/dev/null || true)
            if [[ -z "${ids}" ]]; then
              echo "  无需清理（${desc}）"
              return
            fi
            echo "${ids}" | while read -r id; do
              if gh api -X DELETE "repos/${REPO}/actions/runs/${id}" >/dev/null 2>&1; then
                echo "  已删除 ${desc} run: ${id}"
              else
                echo "::warning::删除 run ${id} 失败（可能已不存在或无权限）"
              fi
            done
          }

          delete_runs '.conclusion=="failure" or .conclusion=="cancelled"' "失败/取消"

          CUTOFF=$(date -d "3 days ago" -u +"%Y-%m-%dT%H:%M:%SZ")
          delete_runs ".conclusion==\"success\" and .created_at < \"${CUTOFF}\"" "3天前成功"

          echo "==== 清理完成 ===="
