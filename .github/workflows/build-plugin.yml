name: SDK 编译插件

on:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: "插件源码仓库地址"
        required: true
        type: string
        default: ""
      architecture:
        description: "选择目标架构"
        required: true
        type: choice
        options:
          - LEDE_Cudy
          - LEDE_R3S
          - LEDE_x86
      plugin_name:
        description: "插件包（空格或逗号连接）"
        required: true
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==================== 步骤1：解析 SDK ====================
      - name: 🔍 解析系统构建资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ github.event.inputs.architecture }}
          SDK_REPO: "xcz-ns/LEDE"
        run: |
          set -euo pipefail
          ARTIFACT_NAME=$(printf '%s' "${{ github.event.inputs.plugin_name }}" | tr -c 'A-Za-z0-9._-' '-')
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "SDK_REPO=$SDK_REPO" >> "$GITHUB_ENV"
          
          TAGS=$(gh release list -R "$SDK_REPO" -L 100 --json tagName -q '.[].tagName | select(endswith("'"$ARCH"'"))')
          [[ -z "$TAGS" ]] && { echo "::error::未找到以 ${ARCH} 结尾的 release 标签"; exit 1; }
          
          for tag in $TAGS; do
            ASSET=$(gh release view "$tag" -R "$SDK_REPO" --json assets -q '.assets[].name | select(test("^openwrt-sdk.*\\.tar\\.xz$"))' | head -n1 || true)
            if [[ -n "$ASSET" ]]; then
              echo "SDK_TAG=$tag" >> "$GITHUB_ENV"
              echo "SDK_ASSET=$ASSET" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          
          echo "::error::所选架构未找到 openwrt-sdk 资产"
          exit 1

      # ==================== 步骤2：下载解压 SDK ====================
      - name: 📥 下载解压核心环境
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${SDK_REPO}/releases/download/${SDK_TAG}/${SDK_ASSET}"
          curl -fL --retry 3 --retry-delay 5 -sS -o sdk.tar.xz "${url}"
          tar -xJf sdk.tar.xz
          echo "SDK_DIR=$(ls -d openwrt-sdk-* | head -n1)" >> "$GITHUB_ENV"

      # ==================== 步骤3：智能提取插件源码 ====================
      - name: 📂 引入第三方插件源码
        shell: bash
        run: |
          set -euo pipefail
          REPO_NORM=$(echo "${{ github.event.inputs.firmware_repo }}" | sed -E 's|.*github\.com[:/]?([^/]+/[^/.]+)(\.git)?|\1|')
          git clone --depth 1 --single-branch "https://github.com/${REPO_NORM}.git" /tmp/custom_source
          
          cd "${SDK_DIR}"
          
          # 核心判断逻辑：对应单插件、多插件源、嵌套子目录等三种情况
          if [ -f "/tmp/custom_source/Makefile" ]; then
            # 根目录直接包含 Makefile (单插件仓库)
            echo "=> 检测到【单插件源码】，重命名并移动至 package/ 目录"
            PLUGIN_DIR_NAME=$(echo "${{ github.event.inputs.plugin_name }}" | awk -F'[, ]+' '{print $1}')
            mv /tmp/custom_source "package/${PLUGIN_DIR_NAME}"
          else
            # 根目录没有 Makefile (多插件或嵌套结构仓库)
            echo "=> 检测到【多插件/嵌套子目录】源码，移入 package/custom/ 目录"
            mkdir -p package/custom/
            mv /tmp/custom_source/* package/custom/ 2>/dev/null || true
          fi

      # ==================== 步骤4：加载软件列表 ====================
      - name: 🔄 更新与安装 feeds
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==================== 步骤5：配置全局构建选项 ====================
      - name: ⚙️ 生成配置并取消全局默认
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          touch .config
          
          # 取消选择默认编译所有软件包的选项，避免编译整个环境的可用软件
          echo "# CONFIG_ALL is not set" >> .config
          echo "# CONFIG_ALL_KMODS is not set" >> .config
          echo "# CONFIG_ALL_NONSHARED is not set" >> .config
          
          make defconfig

      # ==================== 步骤6：严格验证与动态编译 ====================
      - name: 🛠️ 启动目标插件编译
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          PLUGIN_INPUT="${{ github.event.inputs.plugin_name }}"
          read -r -a PLUGINS <<< "${PLUGIN_INPUT//,/ }"
          MISSING=""
          
          for name in "${PLUGINS[@]}"; do
            [[ -z "$name" ]] && continue
            
            # 动态寻址核心：在 package 目录下全局寻找名为 $name 的文件夹
            TARGET=$(find package -type d -name "${name}" -not -path '*/.git*' | while read -r dir; do
              # 严格验证该目录下是否存在 Makefile，存在才认为是有效路径
              if [[ -f "$dir/Makefile" ]]; then
                echo "$dir"
                break
              fi
            done)
            
            # 如果没找到 Makefile，或者目录不存在，则记录并跳过
            if [[ -z "$TARGET" ]]; then
              MISSING="${MISSING} ${name}"
              continue
            fi
            
            # 此时的 TARGET 就是包含了 Makefile 的真实相对路径
            echo "=> 锁定插件真实路径并准备编译: ${TARGET}"
            make "${TARGET}/compile" -j"$(nproc)" || make "${TARGET}/compile" -j1 V=s
          done
          
          if [[ -n "$MISSING" ]]; then
            echo "::error::以下插件未找到或缺少 Makefile: ${MISSING}"
            exit 1
          fi

      # ==================== 步骤7：收集并上传产物 ====================
      - name: 📤 收集上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.event.inputs.architecture }}-${{ env.SDK_TAG }}
          path: ${{ env.SDK_DIR }}/bin/**/*.ipk
          if-no-files-found: error
          retention-days: 7

      # ==================== 步骤8：自动化清理 ====================
      - name: 🧹 清理历史运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          echo "==== 开始清理 $REPO 的历史记录 ===="
          
          gh api repos/$REPO/actions/runs --paginate -q '.workflow_runs[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .id' | \
          xargs -r -I {} gh api -X DELETE repos/$REPO/actions/runs/{}
          
          CUTOFF=$(date -d "3 days ago" -u +"%Y-%m-%dT%H:%M:%SZ")
          gh api repos/$REPO/actions/runs --paginate -q '.workflow_runs[] | select(.conclusion=="success" and .created_at < "'$CUTOFF'") | .id' | \
          xargs -r -I {} gh api -X DELETE repos/$REPO/actions/runs/{}
          
          echo "==== 清理完成 ===="