name: SDK 编译插件

on:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: "插件源码仓库地址"
        required: true
        type: string
        default: ""
      architecture:
        description: "选择目标架构"
        required: true
        type: choice
        options:
          - LEDE_Cudy
          - LEDE_R3S
          - LEDE_x86
      plugin_name:
        description: "插件包（空格连接）"
        required: true
        type: string
        default: ""

permissions:
  contents: read
  actions: write

# 【已按方案B删除 concurrency 块，任务不再排队，支持同时运行】

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==================== 步骤1：解析 SDK ====================
      - name: 解析 SDK 标签与资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ github.event.inputs.architecture }}
          SDK_REPO: "xcz-ns/LEDE"
        run: |
          set -euo pipefail
          ARTIFACT_NAME=$(printf '%s' "${{ github.event.inputs.plugin_name }}" | tr -c 'A-Za-z0-9._-' '-')
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "SDK_REPO=$SDK_REPO" >> "$GITHUB_ENV"
          
          TAGS=$(gh release list -R "$SDK_REPO" -L 100 --json tagName -q '.[].tagName | select(endswith("'"$ARCH"'"))')
          [[ -z "$TAGS" ]] && { echo "::error::未找到以 ${ARCH} 结尾的 release 标签"; exit 1; }
          
          for tag in $TAGS; do
            ASSET=$(gh release view "$tag" -R "$SDK_REPO" --json assets -q '.assets[].name | select(test("^openwrt-sdk.*\\.tar\\.xz$"))' | head -n1 || true)
            if [[ -n "$ASSET" ]]; then
              echo "SDK_TAG=$tag" >> "$GITHUB_ENV"
              echo "SDK_ASSET=$ASSET" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          
          echo "::error::所选架构未找到 openwrt-sdk 资产"
          exit 1

      # ==================== 步骤2：下载解压 SDK ====================
      - name: 下载并解压 SDK
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${SDK_REPO}/releases/download/${SDK_TAG}/${SDK_ASSET}"
          curl -fL --retry 3 --retry-delay 5 -sS -o sdk.tar.xz "${url}"
          tar -xJf sdk.tar.xz
          echo "SDK_DIR=$(ls -d openwrt-sdk-* | head -n1)" >> "$GITHUB_ENV"

      # ==================== 步骤3：智能提取插件源码 ====================
      - name: 下载并配置插件源码
        shell: bash
        run: |
          set -euo pipefail
          REPO_NORM=$(echo "${{ github.event.inputs.firmware_repo }}" | sed -E 's|.*github\.com[:/]?([^/]+/[^/.]+)(\.git)?|\1|')
          git clone --depth 1 --single-branch "https://github.com/${REPO_NORM}.git" /tmp/custom_pkg
          
          # 更新原版 luci 源 (保留你原有的逻辑)
          sed -i 's|^\(src-git luci \).*|\1https://github.com/coolsnowwolf/luci.git;master|' "${SDK_DIR}/feeds.conf.default"
          
          mkdir -p "${SDK_DIR}/package/custom"
          
          # 核心逻辑：智能判断目录结构
          if [ -f "/tmp/custom_pkg/Makefile" ]; then
            # 情况3：根目录有 Makefile（如 luci-app-wolplus）
            # 提取输入的第一个名字，将其作为文件夹名移入 package/custom
            PLUGIN_NAME=$(echo "${{ github.event.inputs.plugin_name }}" | awk '{print $1}')
            echo "检测到单插件根目录结构，移动至 package/custom/${PLUGIN_NAME}"
            mv /tmp/custom_pkg "${SDK_DIR}/package/custom/${PLUGIN_NAME}"
          else
            # 情况1 & 2：插件在子目录中（标准源结构），直接把所有子文件夹拷进去
            echo "检测到多插件/子目录结构，复制子目录至 package/custom/"
            cp -r /tmp/custom_pkg/* "${SDK_DIR}/package/custom/" 2>/dev/null || true
          fi

      # ==================== 步骤4：安装官方 feeds ====================
      - name: 更新并安装 feeds
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          ./scripts/feeds update -a || ./scripts/feeds update -a
          # 这里不再需要 install -p custom，因为我们已经把代码直插到 package 目录了
          ./scripts/feeds install -a || true

      # ==================== 步骤5：配置与下载 ====================
      - name: 生成配置并预下载依赖
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          if ! make defconfig > /tmp/defconfig.log 2>&1; then
            sed -i '/select PACKAGE_busybox-selinux/d; /select PACKAGE_procd-selinux/d' config/Config-build.in
            sed -i 's/ +SELINUX:busybox-selinux +!SELINUX:busybox//g' package/base-files/Makefile
            make defconfig > /tmp/defconfig.log 2>&1
          fi
          make download -j"$(nproc)" V=s || true

      # ==================== 步骤6：编译插件 ====================
      - name: 编译插件
        shell: bash
        run: |
          set -euo pipefail
          cd "${SDK_DIR}"
          PLUGIN_INPUT="${{ github.event.inputs.plugin_name }}"
          read -r -a PLUGINS <<< "${PLUGIN_INPUT//,/ }"
          MISSING=""
          
          for name in "${PLUGINS[@]}"; do
            [[ -z "$name" ]] && continue
            
            # 清理官方 feeds 创建的同名软链接，强制优先编译我们自定义的源码
            find package/feeds -type l -name "${name}" -delete 2>/dev/null || true
            
            # 在 package 目录下全局寻找包含 Makefile 的正确插件路径
            TARGET=$(find package -type d -name "${name}" -not -path '*/.git*' | while read -r dir; do
              if [[ -f "$dir/Makefile" ]]; then
                echo "$dir"
                break
              fi
            done)
            
            if [[ -z "$TARGET" ]]; then
              MISSING="${MISSING} ${name}"
              continue
            fi
            
            echo "=> 准备编译: ${TARGET}"
            make "${TARGET}/compile" -j"$(nproc)" || make "${TARGET}/compile" -j1 V=s
          done
          
          if [[ -n "$MISSING" ]]; then
            echo "::error::以下插件未找到: ${MISSING}"
            exit 1
          fi

      # ==================== 步骤7：收集并上传产物 ====================
      - name: 收集与上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.event.inputs.architecture }}-${{ env.SDK_TAG }}
          path: ${{ env.SDK_DIR }}/bin/**/*.ipk
          if-no-files-found: error
          retention-days: 7

      # ==================== 步骤8：自动化清理 ====================
      - name: 清理工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          echo "==== 开始清理 $REPO 的历史记录 ===="
          
          gh api repos/$REPO/actions/runs --paginate -q '.workflow_runs[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .id' | \
          xargs -r -I {} gh api -X DELETE repos/$REPO/actions/runs/{}
          
          CUTOFF=$(date -d "3 days ago" -u +"%Y-%m-%dT%H:%M:%SZ")
          gh api repos/$REPO/actions/runs --paginate -q '.workflow_runs[] | select(.conclusion=="success" and .created_at < "'$CUTOFF'") | .id' | \
          xargs -r -I {} gh api -X DELETE repos/$REPO/actions/runs/{}
          
          echo "==== 清理完成 ===="